name: Release PyInstaller Builds for Programs

on:
  push:
    tags:  # Trigger builds on <program-name> tags (e.g., v1.0.0)
      - 'ascii_art-*'
      - 'unicorn_run-*'
      - 'black_jack-*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Detect program from tag
        id: detect-program
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Tag: $TAG_NAME"

          if [[ "$TAG_NAME" == ascii_art* ]]; then
            echo "Building ASCII Art"
            echo "program=ascii_art" >> $GITHUB_OUTPUT
            echo "directory=ASCII-art" >> $GITHUB_OUTPUT
            echo "script=ascii_art_generator.py" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == black_jack* ]]; then
            echo "Building black_jack"
            echo "program=black_jack" >> $GITHUB_OUTPUT
            echo "directory=black_jack" >> $GITHUB_OUTPUT
            echo "script=game.py" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == unicorn_run* ]]; then
            echo "Building Unicorn Run"
            echo "program=unicorn_run" >> $GITHUB_OUTPUT
            echo "directory=Unicorn-Run" >> $GITHUB_OUTPUT
            echo "script=game.py" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

          if [ -f "${{ steps.detect-program.outputs.directory }}/requirements.txt" ]; then
            pip install -r "${{ steps.detect-program.outputs.directory }}/requirements.txt"
          fi
        shell: bash

      - name: Build executable (macOS Universal Binary)
        if: matrix.os == 'macos-latest'
        run: |
          cd "${{ steps.detect-program.outputs.directory }}"

          if [ "${{ steps.detect-program.outputs.program }}" == "ascii_art" ]; then
            # Build for Intel
            python -m PyInstaller --target-architecture x86_64 --onefile "${{ steps.detect-program.outputs.script }}" --name "${{ steps.detect-program.outputs.program }}-x86_64"

            # Build for Apple Silicon
            python -m PyInstaller --target-architecture arm64 --onefile "${{ steps.detect-program.outputs.script }}" --name "${{ steps.detect-program.outputs.program }}-arm64"

            # Create universal binary
            mkdir -p dist/universal
            lipo -create -output "dist/universal/${{ steps.detect-program.outputs.program }}" "dist/${{ steps.detect-program.outputs.program }}-x86_64" "dist/${{ steps.detect-program.outputs.program }}-arm64"

          elif [ "${{ steps.detect-program.outputs.program }}" == "black_jack" ]; then
            # Build for Intel
            python -m PyInstaller --target-architecture x86_64 --onefile --add-data "data:data" --add-data "src/output/forGUI:src/output/forGUI" "${{ steps.detect-program.outputs.script }}" --name "${{ steps.detect-program.outputs.program }}-x86_64"

            # Build for Apple Silicon
            python -m PyInstaller --target-architecture arm64 --onefile --add-data "data:data" --add-data "src/output/forGUI:src/output/forGUI" "${{ steps.detect-program.outputs.script }}" --name "${{ steps.detect-program.outputs.program }}-arm64"

            # Create universal binary
            mkdir -p dist/universal
            lipo -create -output "dist/universal/${{ steps.detect-program.outputs.program }}" "dist/${{ steps.detect-program.outputs.program }}-x86_64" "dist/${{ steps.detect-program.outputs.program }}-arm64"

          elif [ "${{ steps.detect-program.outputs.program }}" == "unicorn_run" ]; then
            # Build for Intel
            python -m PyInstaller --target-architecture x86_64 --onefile --add-data "data:data" --add-data "images:images" "${{ steps.detect-program.outputs.script }}" --name "${{ steps.detect-program.outputs.program }}-x86_64"

            # Build for Apple Silicon
            python -m PyInstaller --target-architecture arm64 --onefile --add-data "data:data" --add-data "images:images" "${{ steps.detect-program.outputs.script }}" --name "${{ steps.detect-program.outputs.program }}-arm64"

            # Create universal binary
            mkdir -p dist/universal
            lipo -create -output "dist/universal/${{ steps.detect-program.outputs.program }}" "dist/${{ steps.detect-program.outputs.program }}-x86_64" "dist/${{ steps.detect-program.outputs.program }}-arm64"
          fi
        shell: bash

      - name: Build executable (Non-macOS)
        if: matrix.os != 'macos-latest'
        run: |
          # OS-specific separator
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            SEP=";"
          else
            SEP=":"
          fi

          cd "${{ steps.detect-program.outputs.directory }}"

          if [ "${{ steps.detect-program.outputs.program }}" == "ascii_art" ]; then
            pyinstaller --onefile "${{ steps.detect-program.outputs.script }}"

          elif [ "${{ steps.detect-program.outputs.program }}" == "black_jack" ]; then
            pyinstaller --onefile --add-data "data${SEP}data" --add-data "src/output/forGUI${SEP}src/output/forGUI" "${{ steps.detect-program.outputs.script }}"

          elif [ "${{ steps.detect-program.outputs.program }}" == "unicorn_run" ]; then
            pyinstaller --onefile --add-data "data${SEP}data" --add-data "images${SEP}images" "${{ steps.detect-program.outputs.script }}"
          fi
        shell: bash

      - name: Package artifact
        id: package
        run: |
          cd "${{ steps.detect-program.outputs.directory }}"

          # Create platform-specific archive name
          ARTIFACT="${{ steps.detect-program.outputs.program }}-${{ matrix.os }}"

          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            # Package the universal binary
            tar -czf "../${ARTIFACT}.tar.gz" -C dist/universal .
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            7z a "../${ARTIFACT}.zip" ./dist/*
            echo "artifact_path=${ARTIFACT}.zip" >> $GITHUB_OUTPUT
          else
            tar -czf "../${ARTIFACT}.tar.gz" -C dist .
          fi

          # Set the artifact path for upload
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            echo "artifact_path=${ARTIFACT}.zip" >> $GITHUB_OUTPUT
          else
            echo "artifact_path=${ARTIFACT}.tar.gz" >> $GITHUB_OUTPUT
          fi

          cd ..
          # Verify file exists
          ls -la "${{ steps.package.outputs.artifact_path }}" || echo "File not found: ${{ steps.package.outputs.artifact_path }}"
        shell: bash

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.package.outputs.artifact_path }}
