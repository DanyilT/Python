name: Release PyInstaller Builds for Programs

on:
  push:
    tags:  # Trigger builds on <program-name> tags (e.g., v1.0.0)
      - 'ascii_art-*'
      - 'blackJack-*'
      - 'unicorn_run-*'

jobs:
  determine_program:
    runs-on: ubuntu-latest
    outputs:
      program_name: ${{ steps.set-program.outputs.program }}
    steps:
      - id: set-program
        run: |
          if [[ ${{ github.ref }} == refs/tags/ascii_art-* ]]; then
            echo "program=ascii_art" >> $GITHUB_OUTPUT
          elif [[ ${{ github.ref }} == refs/tags/blackJack-* ]]; then
            echo "program=blackJack" >> $GITHUB_OUTPUT
          elif [[ ${{ github.ref }} == refs/tags/unicorn_run-* ]]; then
            echo "program=unicorn_run" >> $GITHUB_OUTPUT
          fi

  build_and_release:
    needs: determine_program
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Configure paths for program
        id: configure
        shell: bash
        run: |
          PROGRAM="${{ needs.determine_program.outputs.program_name }}"
          if [[ "$PROGRAM" == "ascii_art" ]]; then
            echo "project_dir=ASCII-art" >> $GITHUB_OUTPUT
            echo "main_script=ASCII-art/ascii_art_generator.py" >> $GITHUB_OUTPUT
            echo "requirements_file=ASCII-art/requirements.txt" >> $GITHUB_OUTPUT
            echo "extra_args=" >> $GITHUB_OUTPUT
          elif [[ "$PROGRAM" == "blackJack" ]]; then
            echo "project_dir=BlackJack" >> $GITHUB_OUTPUT
            echo "main_script=BlackJack/game.py" >> $GITHUB_OUTPUT
            echo "requirements_file=BlackJack/requirements.txt" >> $GITHUB_OUTPUT
            if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
              echo 'extra_args=--add-data "data;data" --add-data "src/output/forGUI;src/output/forGUI"' >> $GITHUB_OUTPUT
            else
              echo 'extra_args=--add-data "data:data" --add-data "src/output/forGUI:src/output/forGUI"' >> $GITHUB_OUTPUT
            fi
          elif [[ "$PROGRAM" == "unicorn_run" ]]; then
            echo "project_dir=Unicorn-Run" >> $GITHUB_OUTPUT
            echo "main_script=Unicorn-Run/game.py" >> $GITHUB_OUTPUT
            echo "requirements_file=Unicorn-Run/requirements.txt" >> $GITHUB_OUTPUT
            if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
              echo 'extra_args=--add-data "data;data" --add-data "images;images"' >> $GITHUB_OUTPUT
            else
              echo 'extra_args=--add-data "data:data" --add-data "images:images"' >> $GITHUB_OUTPUT
            fi
          fi

      - name: Debug info
        run: |
          echo "Program: ${{ needs.determine_program.outputs.program_name }}"
          echo "Project dir: ${{ steps.configure.outputs.project_dir }}"
          echo "Main script: ${{ steps.configure.outputs.main_script }}"
          echo "Requirements file: ${{ steps.configure.outputs.requirements_file }}"
          echo "Extra args: ${{ steps.configure.outputs.extra_args }}"
          ls -la
          ls -la ${{ steps.configure.outputs.project_dir }} || echo "Directory not found"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          if [ -f "${{ steps.configure.outputs.requirements_file }}" ]; then
            python -m pip install -r "${{ steps.configure.outputs.requirements_file }}"
          fi

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --onefile ${{ steps.configure.outputs.extra_args }} "${{ steps.configure.outputs.main_script }}"

      - name: Archive executable
        run: |
          mkdir -p release_artifacts
          cp -r dist/* release_artifacts/
          # For Windows, zip the artifacts
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a "${{ needs.determine_program.outputs.program_name }}-${{ matrix.os }}.zip" ./release_artifacts/*
          else
            tar -czf "${{ needs.determine_program.outputs.program_name }}-${{ matrix.os }}.tar.gz" -C release_artifacts .
          fi

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ needs.determine_program.outputs.program_name }}-${{ matrix.os }}.tar.gz
            ${{ needs.determine_program.outputs.program_name }}-${{ matrix.os }}.zip
