name: Build and Release

on:
  push:
    tags:  # Trigger builds on <program-name> tags (e.g., v1.0.0)
      - 'ascii_art-*'
      - 'unicorn_run-*'
      - 'black_jack-*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-13
            arch: x64
          - os: macos-latest
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Detect program from tag
        id: detect-program
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Tag: $TAG_NAME"

          if [[ "$TAG_NAME" == ascii_art* ]]; then
            echo "Building ASCII Art"
            echo "program=ascii_art" >> $GITHUB_OUTPUT
            echo "directory=ASCII-art" >> $GITHUB_OUTPUT
            echo "script=ascii_art_generator.py" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == black_jack* ]]; then
            echo "Building black_jack"
            echo "program=black_jack" >> $GITHUB_OUTPUT
            echo "directory=black_jack" >> $GITHUB_OUTPUT
            echo "script=game.py" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == unicorn_run* ]]; then
            echo "Building Unicorn Run"
            echo "program=unicorn_run" >> $GITHUB_OUTPUT
            echo "directory=Unicorn-Run" >> $GITHUB_OUTPUT
            echo "script=game.py" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install PyInstaller version appropriate for the OS
          if [[ "${{ matrix.os }}" == "macos-13" || "${{ matrix.os }}" == "macos-latest" ]]; then
            python -m pip install "pyinstaller==5.6.2" pyinstaller-hooks-contrib
          else
            python -m pip install pyinstaller
          fi

          if [ -f "${{ steps.detect-program.outputs.directory }}/requirements.txt" ]; then
            python -m pip install -r "${{ steps.detect-program.outputs.directory }}/requirements.txt"
          fi
        shell: bash

      - name: Create Python app bundle (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          cd "${{ steps.detect-program.outputs.directory }}"

          # Create prefix for architecture
          if [[ "${{ matrix.os }}" == "macos-12" ]]; then
            ARCH_PREFIX="intel"
          else
            ARCH_PREFIX="silicon"
          fi

          # Create a proper macOS .app bundle - no exclusions
          if [[ "${{ steps.detect-program.outputs.program }}" == "ascii_art" ]]; then
            python -m PyInstaller --windowed --onedir \
              --name "${{ steps.detect-program.outputs.program }}_${ARCH_PREFIX}" \
              "${{ steps.detect-program.outputs.script }}"
              
          elif [[ "${{ steps.detect-program.outputs.program }}" == "black_jack" ]]; then
            python -m PyInstaller --windowed --onedir \
              --add-data "data:data" \
              --add-data "src/output/forGUI:src/output/forGUI" \
              --name "${{ steps.detect-program.outputs.program }}_${ARCH_PREFIX}" \
              "${{ steps.detect-program.outputs.script }}"
              
          elif [[ "${{ steps.detect-program.outputs.program }}" == "unicorn_run" ]]; then
            python -m PyInstaller --windowed --onedir \
              --add-data "data:data" \
              --add-data "images:images" \
              --name "${{ steps.detect-program.outputs.program }}_${ARCH_PREFIX}" \
              "${{ steps.detect-program.outputs.script }}"
          fi
          # Create a simple launcher script for Terminal users
          cat > "dist/run_${{ steps.detect-program.outputs.program }}_${ARCH_PREFIX}.command" << 'EOF'
#!/bin/bash
DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
open "$DIR/${{ steps.detect-program.outputs.program }}_${ARCH_PREFIX}.app"
EOF
          chmod +x "dist/run_${{ steps.detect-program.outputs.program }}_${ARCH_PREFIX}.command"
        shell: bash

      - name: Build executable for Windows/Linux
        if: matrix.os != 'macos-13' && matrix.os != 'macos-latest'
        run: |
          # OS-specific separator
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            SEP=";"
          else
            SEP=":"
          fi

          cd "${{ steps.detect-program.outputs.directory }}"

          if [[ "${{ steps.detect-program.outputs.program }}" == "ascii_art" ]]; then
            python -m PyInstaller --onefile "${{ steps.detect-program.outputs.script }}"

          elif [[ "${{ steps.detect-program.outputs.program }}" == "black_jack" ]]; then
            python -m PyInstaller --onefile --add-data "data${SEP}data" --add-data "src/output/forGUI${SEP}src/output/forGUI" "${{ steps.detect-program.outputs.script }}"

          elif [[ "${{ steps.detect-program.outputs.program }}" == "unicorn_run" ]]; then
            python -m PyInstaller --onefile --add-data "data${SEP}data" --add-data "images${SEP}images" "${{ steps.detect-program.outputs.script }}"
          fi
        shell: bash

      - name: Package macOS Intel artifact
        if: matrix.os == 'macos-13'
        id: package_intel
        run: |
          cd "${{ steps.detect-program.outputs.directory }}"
          ARTIFACT="${{ steps.detect-program.outputs.program }}-macos-intel"
          cd dist
          hdiutil create -volname "${{ steps.detect-program.outputs.program }}_intel" \
            -srcfolder . -ov -format UDZO "../../${ARTIFACT}.dmg"
          cd ../..
          echo "artifact_path=${ARTIFACT}.dmg" >> $GITHUB_OUTPUT
        shell: bash

      - name: Package macOS Silicon artifact
        if: matrix.os == 'macos-latest' && matrix.arch == 'arm64'
        id: package_silicon
        run: |
          cd "${{ steps.detect-program.outputs.directory }}"
          ARTIFACT="${{ steps.detect-program.outputs.program }}-macos-silicon"
          cd dist
          # Create DMG for better macOS experience
          hdiutil create -volname "${{ steps.detect-program.outputs.program }}_silicon" \
            -srcfolder . -ov -format UDZO "../../${ARTIFACT}.dmg"
          cd ../..
          echo "artifact_path=${ARTIFACT}.dmg" >> $GITHUB_OUTPUT
        shell: bash

      - name: Package Windows/Linux artifact
        if: matrix.os != 'macos-13' && matrix.os != 'macos-latest'
        id: package_other
        run: |
          cd "${{ steps.detect-program.outputs.directory }}"

          # Create platform-specific archive name
          ARTIFACT="${{ steps.detect-program.outputs.program }}-${{ matrix.os }}"

          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            7z a "../${ARTIFACT}.zip" ./dist/*
            echo "artifact_path=${ARTIFACT}.zip" >> $GITHUB_OUTPUT
          else
            tar -czf "../${ARTIFACT}.tar.gz" -C dist .
            echo "artifact_path=${ARTIFACT}.tar.gz" >> $GITHUB_OUTPUT
          fi

          cd ..
        shell: bash

      - name: Upload macOS Intel build
        if: matrix.os == 'macos-13'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.package_intel.outputs.artifact_path }}

      - name: Upload macOS Silicon build
        if: matrix.os == 'macos-latest' && matrix.arch == 'arm64'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.package_silicon.outputs.artifact_path }}

      - name: Upload Windows/Linux build
        if: matrix.os != 'macos-13' && matrix.os != 'macos-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.package_other.outputs.artifact_path }}
