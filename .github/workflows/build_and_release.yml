name: Release PyInstaller Builds for Programs

on:
  push:
    tags:  # Trigger builds on <program-name> tags (e.g., v1.0.0)
      - 'ascii_art-*'
      - 'blackJack-*'
      - 'unicorn_run-*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

          # Extract program name from tag
          echo "GITHUB_REF: ${{ github.ref }}"
          if [[ "${{ github.ref }}" == *"ascii_art"* ]]; then
            echo "Building ASCII-art"
            PROGRAM="ascii_art"
            if [ -f "ASCII-art/requirements.txt" ]; then
              pip install -r ASCII-art/requirements.txt
            fi
          elif [[ "${{ github.ref }}" == *"blackJack"* ]]; then
            echo "Building BlackJack"
            PROGRAM="blackJack"
            if [ -f "BlackJack/requirements.txt" ]; then
              pip install -r BlackJack/requirements.txt
            fi
          elif [[ "${{ github.ref }}" == *"unicorn_run"* ]]; then
            echo "Building Unicorn-Run"
            PROGRAM="unicorn_run"
            if [ -f "Unicorn-Run/requirements.txt" ]; then
              pip install -r Unicorn-Run/requirements.txt
            fi
          else
            echo "Unknown program in tag: ${{ github.ref }}"
            exit 1
          fi
          echo "PROGRAM=$PROGRAM" >> $GITHUB_ENV
        shell: bash

      - name: List directory contents
        run: |
          ls -la
          if [ -d "ASCII-art" ]; then ls -la ASCII-art; fi
          if [ -d "BlackJack" ]; then ls -la BlackJack; fi
          if [ -d "Unicorn-Run" ]; then ls -la Unicorn-Run; fi
        shell: bash

      - name: Build executable
        run: |
          # Set separator based on OS
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            SEP=";"
          else
            SEP=":"
          fi

          # Build based on program
          if [[ "${{ env.PROGRAM }}" == "ascii_art" ]]; then
            # Simple build with no data files
            cd ASCII-art
            pyinstaller --onefile ascii_art_generator.py

          elif [[ "${{ env.PROGRAM }}" == "blackJack" ]]; then
            cd BlackJack
            # Add data files using the right separator
            pyinstaller --onefile --add-data "data${SEP}data" --add-data "src/output/forGUI${SEP}src/output/forGUI" game.py

          elif [[ "${{ env.PROGRAM }}" == "unicorn_run" ]]; then
            cd Unicorn-Run
            # Add data files using the right separator
            pyinstaller --onefile --add-data "data${SEP}data" --add-data "images${SEP}images" game.py
          fi
        shell: bash

      - name: Package executable
        run: |
          # Find the dist directory and create archive
          if [[ "${{ env.PROGRAM }}" == "ascii_art" ]]; then
            cd ASCII-art
          elif [[ "${{ env.PROGRAM }}" == "blackJack" ]]; then
            cd BlackJack
          elif [[ "${{ env.PROGRAM }}" == "unicorn_run" ]]; then
            cd Unicorn-Run
          fi

          # Create archive with OS-specific naming
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a ../${{ env.PROGRAM }}-${{ matrix.os }}.zip ./dist/*
          else
            tar -czf ../${{ env.PROGRAM }}-${{ matrix.os }}.tar.gz ./dist/
          fi
          cd ..
        shell: bash

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.PROGRAM }}-${{ matrix.os }}.zip
            ${{ env.PROGRAM }}-${{ matrix.os }}.tar.gz
