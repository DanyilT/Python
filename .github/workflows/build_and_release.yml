name: Release PyInstaller Builds for Programs

on:
  push:
    tags:  # Trigger builds on <program-name> tags (e.g., v1.0.0)
      - 'ascii_art-*'
      - 'blackJack-*'
      - 'unicorn_run-*'

jobs:
  build_and_release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        program: [ascii_art, blackJack, unicorn_run]

    steps:
      - name: Check out
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          if [ -f "${{ matrix.program }}/requirements.txt" ]; then
            pip install -r "${{ matrix.program }}/requirements.txt"
          fi
          pip install pyinstaller

      - name: Build Program
        run: |
          # Determine the path separator for --add-data based on OS
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            SEP=";"
          else
            SEP=":"
          fi

          # Build according to the program name:
          if [ "${{ matrix.program }}" = "ascii_art" ]; then
            # ASCII-art
            pyinstaller --onefile \
              "${{ matrix.program }}/ascii_art_generator.py"

          elif [ "${{ matrix.program }}" = "blackJack" ]; then
            # BlackJack
            cd BlackJack
            pyinstaller --onefile \
              --add-data "data${SEP}./data" \
              --add-data "src/output/forGUI${SEP}./src/output/forGUI" \
              game.py
            cd ..

          elif [ "${{ matrix.program }}" = "unicorn_run" ]; then
            # Unicorn-Run
            cd Unicorn-Run
            pyinstaller --onefile \
              --add-data "data${SEP}./data" \
              --add-data "images${SEP}./images" \
              game.py
            cd ..

      - name: Archive Executable
        run: |
          # Each PyInstaller dist/ folder is created inside its respective sub-directory
          # for blackJack and unicorn_run, we've cd'ed into that subfolder. The simplest
          # approach is to find newly created dist/ subfolders:
          tar -czf ${{ matrix.program }}-${{ matrix.os }}.tar.gz **/dist

      - name: Create GitHub Release
        if: startsWith(github.ref, format('refs/tags/{0}-', matrix.program))
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.program }}-${{ matrix.os }}.tar.gz
